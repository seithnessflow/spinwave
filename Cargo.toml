[workspace]
resolver = "2"
members = [
    "crates/spinwave-poly",
    "crates/spinwave-dsp",
    "crates/spinwave-params",
    "crates/spinwave-engine",
    "crates/spinwave-plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["spinwave contributors"]

[workspace.dependencies]
wide = "0.7"
bytemuck = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
opt-level = 3

[profile.bench]
lto = "thin"
