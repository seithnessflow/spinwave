[workspace]
resolver = "2"
members = [
    "crates/spinwave-poly",
    "crates/spinwave-dsp",
    "crates/spinwave-params",
    "crates/spinwave-engine",
    "crates/spinwave-plugin",
    "crates/spinwave-control",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["spinwave contributors"]

[workspace.dependencies]
wide = "0.7"
bytemuck = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
opt-level = 3

[profile.bench]
lto = "thin"

# The DSP crates optimised under the dev profile too: a Debug workspace
# test run rendered for 43 minutes on every core (2026-09-14), Release
# does the same in about a minute, and opt-level does not switch the
# debug assertions off (memory.rs's guard against a NaN in a delay still
# fires). Floats are not reassociated at any opt-level, so the golden
# bench reads the same bytes.
[profile.dev.package.spinwave-poly]
opt-level = 3
[profile.dev.package.spinwave-dsp]
opt-level = 3
[profile.dev.package.spinwave-engine]
opt-level = 3
