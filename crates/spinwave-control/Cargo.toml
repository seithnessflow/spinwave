[package]
name = "spinwave-control"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "MCP server exposing the Spinwave engine to LLM agents: patch editing, rendering, audio analysis (GPLv3)"

[lib]
name = "spinwave_control"
path = "src/lib.rs"

[[bin]]
name = "spinwave-mcp"
path = "src/main.rs"

[[bin]]
name = "spinwave-cli"
path = "src/bin/cli.rs"

[dependencies]
spinwave-poly = { path = "../spinwave-poly" }
spinwave-dsp = { path = "../spinwave-dsp" }
spinwave-engine = { path = "../spinwave-engine" }
spinwave-params = { path = "../spinwave-params" }
spinwave-plugin = { path = "../spinwave-plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
realfft = "3"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4"] }
